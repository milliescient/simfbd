# Every setting a run's config.yml can hold, with the value it takes when the config leaves
# it out. One marked required has none. This file is where those values come from: simfbd
# reads it, so what it says is what happens. `simfbd config default run` prints it.

# uses: [rb@28e5b2]               # optional. Refused unless what simfbd runs is at these versions:
#                                 # any of simfbd, rb, as `simfbd uses` prints them.

inference:
  model:                        # required. fbdr: dnFBDRP; bds: dnBDS; fbdsp: dnFBDSP
  record_read:                  # required. the batch's specimens_<this> directory
  record_treated_as:            # required. complete or incomplete
  conditioned_on:               # required
  extant_sampling_probability:  # required
  origin_prior: uniform
  survivors: true
  drop_present_only_taxa: false

mcmc:
  generations:                  # required
  sample_every:                 # required
  chains_at_once:               # required. replicates fitted in parallel
