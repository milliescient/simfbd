[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "simfbdr"
version = "0.1.0"
description = "Simulate batches of fossil records and analyze them, for simulation-based calibration"
requires-python = ">=3.10"
# numpy is what `simfbdr ranks` needs. R, its packages and rb are not Python's to install:
# `simfbdr doctor` says whether this machine has them.
dependencies = ["PyYAML", "numpy"]

[project.scripts]
simfbdr = "simfbdr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
simfbdr = ["scripts/*", "defaults/*.yml", "_commit.txt"]
